<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compras de roupa</title>
</head>
<body style="margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; background-color: #f0f4f8; display: flex; justify-content: center; align-items: center; min-height: 100vh;">

    <!-- Card Principal -->
    <div style="background-color: #ffffff; width: 100%; max-width: 380px; padding: 2rem; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); text-align: center; box-sizing: border-box;">
        
        <!-- Cabeçalho -->
        <h3 style="margin: 0 0 0.5rem 0; color: #1e293b; font-size: 1.75rem; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 0.5rem;">
            <span>🛍️</span> Compras
        </h3>
        
        <p style="margin: 0 0 1.5rem 0; color: #64748b; font-size: 1rem; font-weight: 400;">
            Bem-vindo(a) à nossa loja
        </p>

        <!-- Espaço Reservado para Imagem (Placeholder) -->
        <div style="width: 100%; height: 180px; background-color: #f8fafc; border: 2px dashed #cbd5e1; border-radius: 12px; display: flex; flex-direction: column; justify-content: center; align-items: center; color: #94a3b8; margin-bottom: 1.5rem;">
            <span style="font-size: 2.5rem; margin-bottom: 0.5rem;">👕</span>
            <span style="font-size: 0.85rem; font-weight: 500; letter-spacing: 0.5px;">Espaço reservado para imagem</span>
        </div>

        <!-- Links de Navegação -->
        <div style="display: flex; flex-direction: column; gap: 0.75rem;">
            
            <a href="/" style="display: flex; align-items: center; justify-content: center; gap: 0.5rem; padding: 0.85rem; background-color: #2563eb; color: #ffffff; text-decoration: none; border-radius: 10px; font-weight: 600; font-size: 0.95rem; box-shadow: 0 4px 12px rgba(37, 99, 235, 0.2);">
                <span>🏠</span> Início Home
            </a>
            
            <a href="erro" style="display: flex; align-items: center; justify-content: center; gap: 0.5rem; padding: 0.85rem; background-color: #f1f5f9; color: #475569; text-decoration: none; border-radius: 10px; font-weight: 600; font-size: 0.95rem;">
                <span>⚠️</span> Página de erro
            </a>
            
        </div>

    </div>

</body>
</html>
